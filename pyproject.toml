[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sender"
version = "0.1.0"
description = "DTU simulator — sends binary sensor frames to the Data Receiving C# service"
requires-python = ">=3.10"
dependencies = [
    "jsonschema>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "pytest-cov",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"

[tool.coverage.run]
omit = [
    "src/sender/__main__.py",
    "src/sender/transport.py",
    "src/sender/modes/*",
]
